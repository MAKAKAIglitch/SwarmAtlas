[package]
name = "swarmatlas-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Read-only Windows network ownership collector for SwarmAtlas"

[lib]
name = "_swarmatlas_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py311"] }

[target.'cfg(windows)'.dependencies]
socket2 = "=0.6.5"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Diagnostics_ToolHelp",
] }
