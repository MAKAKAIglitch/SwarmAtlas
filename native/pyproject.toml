[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "swarmatlas-native"
version = "0.1.0"
description = "Optional Rust network-monitoring extension for SwarmAtlas"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.maturin]
bindings = "pyo3"
module-name = "_swarmatlas_native"
