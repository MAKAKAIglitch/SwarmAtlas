name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install "maturin==1.16.0"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: native
      - name: Test the Rust core
        run: cargo test
        working-directory: native
      - name: Build the Windows Rust extension wheel
        run: maturin build --release --out dist
        working-directory: native
      - name: Install the compiled Rust extension
        shell: pwsh
        run: |
          $wheel = Get-ChildItem native/dist/*.whl | Select-Object -First 1
          if ($null -eq $wheel) { throw "Native wheel was not created." }
          if ($wheel.Name -notmatch "-cp311-abi3-win_amd64\.whl$") { throw "Unexpected native wheel ABI tag: $($wheel.Name)" }
          python -m pip install $wheel.FullName
      - name: Verify Windows process ownership APIs
        run: python -c "import _swarmatlas_native as n; print(n.capabilities()); print('TCP rows:', len(n.list_tcp_connections())); print('UDP bindings:', len(n.list_udp_bindings()))"
      - run: python -m pytest
      - run: python -m compileall run_windows.py update_project.py src benchmarks
      - uses: actions/upload-artifact@v4
        with:
          name: swarmatlas-native-win-x64
          path: native/dist/*.whl
          if-no-files-found: error
          retention-days: 14

  publish-native:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: swarmatlas-native-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download the wheel produced by the successful test job
        uses: actions/download-artifact@v4
        with:
          name: swarmatlas-native-win-x64
          path: dist
      - name: Publish the tested native wheel
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*-cp311-abi3-win_amd64.whl' -print)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one stable-ABI Windows wheel; found ${#wheels[@]}."
            exit 1
          fi

          wheel="${wheels[0]}"
          wheel_name="$(basename "$wheel")"
          sha256sum "$wheel" > dist/wheel.sha256

          tag="native-latest"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SwarmAtlas native core (latest)" \
              --notes "Latest stable-ABI Windows x64 optional Rust monitoring core. Built and tested by GitHub Actions."
          fi

          gh release upload "$tag" "$wheel" dist/wheel.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
