name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install "maturin==1.16.0"
      - name: Test the Rust core
        run: cargo test
        working-directory: native
      - name: Build the Windows Rust extension wheel
        run: maturin build --release --out dist
        working-directory: native
      - name: Install the compiled Rust extension
        shell: pwsh
        run: |
          $wheel = Get-ChildItem native/dist/*.whl | Select-Object -First 1
          if ($null -eq $wheel) { throw "Native wheel was not created." }
          if ($wheel.Name -notmatch "-cp311-abi3-win_amd64\.whl$") { throw "Unexpected native wheel ABI tag: $($wheel.Name)" }
          python -m pip install $wheel.FullName
      - name: Verify Windows process ownership APIs
        run: python -c "import _swarmatlas_native as n; print(n.capabilities()); print('TCP rows:', len(n.list_tcp_connections())); print('UDP bindings:', len(n.list_udp_bindings()))"
      - run: python -m pytest
      - run: python -m compileall run_windows.py update_project.py src benchmarks
      - uses: actions/upload-artifact@v4
        with:
          name: swarmatlas-native-win-x64
          path: native/dist/*.whl
          if-no-files-found: error
          retention-days: 14
      
      - name: Publish the latest optional Rust wheel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $wheel = Get-ChildItem native/dist/swarmatlas_native-*-cp311-abi3-win_amd64.whl | Select-Object -First 1
          if ($null -eq $wheel) { throw "Stable-ABI Windows wheel was not created." }
          gh --version
          if ($LASTEXITCODE -ne 0) { throw "GitHub CLI is not available on this runner." }

          $checksum = Join-Path $env:RUNNER_TEMP "wheel.sha256"
          $hash = (Get-FileHash $wheel.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($wheel.Name)" | Set-Content -Encoding ascii $checksum

          $tag = "native-latest"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "SwarmAtlas native core (latest)" --notes "Latest stable-ABI Windows x64 optional Rust monitoring core. Built and tested by GitHub Actions."
            if ($LASTEXITCODE -ne 0) { throw "Could not create the native-latest release." }
          }

          gh release upload $tag $wheel.FullName $checksum --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the native wheel and SHA-256 file." }
